<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="聚核智算（FUSIM）是一家聚变等离子体软件SaaS服务商，致力于为科研机构和企业提供高效、精准的仿真解决方案，推动聚变能源技术的发展。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" />
    <!-- 主题脚本必须排在任何外部样式表之前：被字体 CSS 卡住时 body 都还没解析出来 -->
    <script>
      // 亮色（白纸 + 墨色）为默认主题；URL ?theme= 可显式指定，用户切换后记住选择。
      const fromUrl = new URLSearchParams(location.search).get('theme')
      let stored = null
      try {
        stored = localStorage.getItem('theme')
      } catch {
        /* localStorage 不可用时忽略已存选择 */
      }
      const theme = [fromUrl, stored].find((value) => value === 'light' || value === 'dark') ?? 'light'
      document.documentElement.dataset.theme = theme
      // theme-color 跟随主题的中性底色，移动端地址栏不留白边
      const themeColor = theme === 'dark' ? '#0a0c10' : '#f7f8fa'
      document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor)
    </script>
    <!-- 图标：ico 兜底在前，svg 最后声明——现代浏览器优先用矢量，老环境回落 ico -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>聚核智算 FUSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 首屏全局样式：必须内联在 head 里，createGlobalStyle 要等 JS 执行才注入会闪白 */

      /* ---------- 设计令牌：亮色（默认）——冷白纸 + 墨色，钢蓝主色 ---------- */
      :root {
        /* 原生控件 / 滚动条跟随主题，而不是永远是亮色 */
        color-scheme: light;
        --bg: #f7f8fa;
        --bg-soft: #ffffff;
        --bg-deep: #eef1f5;
        --bg-card: rgba(255, 255, 255, 0.86);
        --surface-translucent: rgba(255, 255, 255, 0.66);
        --accent: #1d4ed8;
        --accent-deep: #163bb0;
        --accent-ink: #1b46c2;
        --gold: #b45309;
        --gold-deep: #92400e;
        --text: #101418;
        --text-muted: #5a6472;
        --line: rgba(16, 20, 24, 0.14);
        --line-strong: rgba(16, 20, 24, 0.3);
        --grid-line: rgba(16, 20, 24, 0.055);
        --glow-a: rgba(29, 78, 216, 0.06);
        --glow-b: rgba(29, 78, 216, 0.04);
        --code-bg: rgba(29, 78, 216, 0.06);
        --metric-bg: rgba(29, 78, 216, 0.06);
        --metric-border: rgba(29, 78, 216, 0.22);
        --header-bg: rgba(247, 248, 250, 0.84);
        --shadow: 0 32px 80px rgba(16, 20, 24, 0.12);
        --shadow-card: 0 12px 32px rgba(16, 20, 24, 0.08);
        --glow-accent: 0 12px 32px rgba(29, 78, 216, 0.16);
        --prose-shadow: 0 18px 50px rgba(16, 20, 24, 0.08);
        /* 主操作色上的前景：钢蓝底白字 */
        --on-accent: #ffffff;

        /* 主色 / 点缀色的 RGB 三元组：供 rgba(var(--accent-rgb), α) 使用 */
        --accent-rgb: 29, 78, 216;
        --hl-rgb: 180, 83, 9;

        --radius-lg: 0px;
        --radius-md: 0px;
        --radius-sm: 0px;
        --radius-xl: 0px;
        --max-width: 1200px;
        --max-width-wide: 1360px;
        --header-h: 66px;

        --font-sans: "Space Grotesk", "Noto Sans SC", system-ui, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --font-serif: var(--font-sans);
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }

      /* ---------- 暗色：炭黑 + 白字，浅钢蓝主色 ---------- */
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0a0c10;
        --bg-soft: #12151b;
        --bg-deep: #06070a;
        --bg-card: rgba(18, 21, 27, 0.72);
        --surface-translucent: rgba(18, 21, 27, 0.6);
        --accent: #7aa2ff;
        --accent-deep: #a7c2ff;
        --accent-ink: #9fb8ff;
        --gold: #ffb067;
        --gold-deep: #ffc998;
        --text: #eef2f7;
        --text-muted: #9aa4b2;
        --line: rgba(238, 242, 247, 0.16);
        --line-strong: rgba(238, 242, 247, 0.34);
        --grid-line: rgba(238, 242, 247, 0.05);
        --glow-a: rgba(122, 162, 255, 0.1);
        --glow-b: rgba(122, 162, 255, 0.05);
        --code-bg: rgba(122, 162, 255, 0.1);
        --metric-bg: rgba(122, 162, 255, 0.08);
        --metric-border: rgba(122, 162, 255, 0.24);
        --header-bg: rgba(10, 12, 16, 0.78);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        --shadow-card: 0 16px 44px rgba(0, 0, 0, 0.45);
        --glow-accent: 0 12px 40px rgba(0, 0, 0, 0.5);
        --prose-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        --on-accent: #08090c;

        --accent-rgb: 122, 162, 255;
        --hl-rgb: 255, 176, 103;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* 页头固定在视口顶端：页面内锚点（如 #contact）跳转时自动让出页头高度 */
      html {
        scroll-padding-top: var(--header-h);
      }

      body {
        font-family: var(--font-sans);
        background:
          radial-gradient(1100px 520px at 78% -8%, var(--glow-a), transparent 60%),
          radial-gradient(900px 480px at 8% -4%, var(--glow-b), transparent 55%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* 精细网格：只在首屏区域浮现，营造图纸感 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, black 25%, transparent 78%);
        mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, black 25%, transparent 78%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      ::selection {
        background: rgba(var(--accent-rgb), 0.32);
        color: var(--text);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
