<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="聚核智算（FUSIM）是一家聚变等离子体软件SaaS服务商，致力于为科研机构和企业提供高效、精准的仿真解决方案，推动聚变能源技术的发展。"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>聚核智算 FUSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 首屏全局样式：必须内联在 head 里，createGlobalStyle 要等 JS 执行才注入会闪白 */
      :root {
        --bg: #f7f8fb;
        --bg-soft: #ffffff;
        --bg-card: #ffffff;
        --accent: #3f6df6;
        --accent-2: #4fd1c5;
        --text: #1e2432;
        --text-muted: #5b667a;
        --line: rgba(30, 36, 50, 0.12);
        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 6px;
        --shadow: 0 32px 80px rgba(30, 36, 50, 0.12);
        --max-width: 1200px;

        --header-bg: rgba(247, 248, 251, 0.75);
        --surface-translucent: rgba(255, 255, 255, 0.6);
        --bar: rgba(30, 36, 50, 0.12);
        --dot: rgba(30, 36, 50, 0.2);
        --metric-bg: rgba(63, 109, 246, 0.08);
        --metric-border: rgba(63, 109, 246, 0.2);
        --prose-shadow: 0 18px 50px rgba(30, 36, 50, 0.08);

        --font-sans: "Space Grotesk", system-ui, sans-serif;
        --font-serif: "Source Serif 4", serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      html[data-theme="dark"] {
        --bg: #0f1218;
        --bg-soft: #151a23;
        --bg-card: #161d29;
        --accent: #79a6ff;
        --accent-2: #5ee2d1;
        --text: #f5f7fb;
        --text-muted: #9aa4b5;
        --line: rgba(255, 255, 255, 0.1);
        --shadow: 0 40px 80px rgba(0, 0, 0, 0.5);

        --header-bg: rgba(15, 18, 24, 0.75);
        --surface-translucent: rgba(21, 26, 35, 0.6);
        --bar: rgba(255, 255, 255, 0.12);
        --dot: rgba(255, 255, 255, 0.2);
        --metric-bg: rgba(121, 166, 255, 0.12);
        --metric-border: rgba(121, 166, 255, 0.3);
        --prose-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background:
          radial-gradient(circle at 12% 10%, rgba(63, 109, 246, 0.12), transparent 40%),
          radial-gradient(circle at 80% 18%, rgba(79, 209, 197, 0.14), transparent 45%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (error) {
        /* localStorage 不可用时保持默认主题 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
